<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Food Tracker - Rolling v Target</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif; background:#f5f5f5; padding:16px; margin:0; }
    .container { max-width:100%; background:#fff; border-radius:8px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    h1 { margin:0 0 8px 0; font-size:24px; color:#333; }
    .subtitle { color:#666; font-size:14px; margin-bottom:20px; }
    #chartContainer { position:relative; height:420px; margin-bottom:20px; }
    canvas { width:100%; height:100%; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
    .stat-box { background:#f9f9f9; padding:12px; border-radius:6px; border-left:4px solid #4CAF50; }
    .stat-label { font-size:12px; color:#666; text-transform:uppercase; font-weight:600; }
    .stat-value { font-size:24px; font-weight:bold; color:#333; margin-top:4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Food: Rolling v Target</h1>
    <p class="subtitle">30‑day view with rolling 7‑day unique counts (from food_record.csv)</p>

    <div id="chartContainer"><canvas id="performanceChart"></canvas></div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Today's 7‑Day Unique Count</div>
        <div id="todaysCount" class="stat-value">0 foods</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">30‑Day Average (daily)</div>
        <div id="avg30" class="stat-value">0 foods</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Best Day (daily)</div>
        <div id="bestDay" class="stat-value">0 foods</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Days Above 30 (daily)</div>
        <div id="daysAbove30" class="stat-value">0 days</div>
      </div>
    </div>
  </div>

  <script>
  // Single-file portable chart (no Chart.js). Draws a simple bar + line chart on canvas.
  const CHART_VERSION = 'perf-chart v3 embedded (no external libs) 2026-07-04';
  console.log('Loaded', CHART_VERSION);
  document.title += ' — ' + CHART_VERSION;

  // Absolute raw CSV URL so the page works when opened from any device via raw.githubusercontent.
  const csvUrl = 'https://raw.githubusercontent.com/JevonDaffyd/python-food-tracker/main/food_record.csv?v=27100be';

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const dateIdx = header.findIndex(h => h.includes('date'));
    const foodIdx = header.findIndex(h => h.includes('food'));
    if (dateIdx === -1 || foodIdx === -1) return [];
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      const date = (cols[dateIdx] || '').trim();
      const food = (cols[foodIdx] || '').trim();
      if (!date || !food) continue;
      out.push({ date: date.slice(0,10), food: food.trim() });
    }
    return out;
  }

  function buildDateRange(startISO, endISO) {
    const out = [];
    let cur = new Date(startISO + 'T00:00:00');
    const end = new Date(endISO + 'T00:00:00');
    while (cur <= end) {
      out.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }

  function computeRollingUnique(arrOfArrays, windowSize = 7) {
    const rolling = [];
    for (let i = 0; i < arrOfArrays.length; i++) {
      const startIdx = Math.max(0, i - windowSize + 1);
      const s = new Set();
      for (let j = startIdx; j <= i; j++) {
        (arrOfArrays[j] || []).forEach(f => s.add(f));
      }
      rolling.push(s.size);
    }
    return rolling;
  }

  // Simple canvas chart renderer (bar + line + dashed target)
  function drawChartCanvas(canvas, labels, dailyCounts, rollingCounts) {
    const DPR = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);
    ctx.clearRect(0,0,rect.width,rect.height);

    // layout
    const padding = {top:20, right:16, bottom:30, left:36};
    const w = rect.width - padding.left - padding.right;
    const h = rect.height - padding.top - padding.bottom;

    // compute y scale
    const maxDataValue = Math.max(...dailyCounts, ...rollingCounts, 30);
    const yMax = Math.ceil((maxDataValue + 5) / 5) * 5;
    const step = 5;

    // draw y grid and labels
    ctx.fillStyle = '#666';
    ctx.font = '12px system-ui, -apple-system, Roboto, Arial';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let val = 0; val <= yMax; val += step) {
      const y = padding.top + h - (val / yMax) * h;
      ctx.fillStyle = '#eee';
      ctx.fillRect(padding.left, y - 0.5, w, 1);
      ctx.fillStyle = '#666';
      ctx.fillText(String(val), padding.left - 8, y);
    }

    // draw bars
    const barGap = 6;
    const n = labels.length;
    const barW = Math.max(6, (w - (n - 1) * barGap) / n);
    for (let i = 0; i < n; i++) {
      const x = padding.left + i * (barW + barGap);
      const val = dailyCounts[i] || 0;
      const barH = (val / yMax) * h;
      const y = padding.top + h - barH;
      ctx.fillStyle = '#999';
      ctx.fillRect(x, y, barW, barH);
    }

    // draw rolling line
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const cx = padding.left + i * (barW + barGap) + barW / 2;
      const cy = padding.top + h - ((rollingCounts[i] || 0) / yMax) * h;
      if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
    }
    ctx.strokeStyle = '#2196F3';
    ctx.lineWidth = 2;
    ctx.stroke();

    // draw target dashed line at 30
    const target = 30;
    const yTarget = padding.top + h - (target / yMax) * h;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(padding.left, yTarget);
    ctx.lineTo(padding.left + w, yTarget);
    ctx.strokeStyle = '#FF9800';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);

    // draw x labels (only first and last)
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const firstLabel = labels[0] || '';
    const lastLabel = labels[labels.length-1] || '';
    const firstX = padding.left + barW/2;
    const lastX = padding.left + (n-1) * (barW + barGap) + barW/2;
    ctx.fillText(formatShortDate(firstLabel), firstX, padding.top + h + 6);
    ctx.fillText(formatShortDate(lastLabel), lastX, padding.top + h + 6);
  }

  function formatShortDate(iso) {
    if (!iso) return '';
    const dt = new Date(iso + 'T00:00:00');
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  (async function main() {
    let text = '';
    try {
      const res = await fetch(csvUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to fetch CSV: ' + res.status);
      text = await res.text();
    } catch (e) {
      console.error('CSV load error', e);
      document.getElementById('todaysCount').textContent = 'CSV load error';
      return;
    }

    const entries = parseCSV(text);
    let maxDate = null;
    entries.forEach(e => { if (!maxDate || e.date > maxDate) maxDate = e.date; });
    if (!maxDate) maxDate = new Date().toISOString().slice(0,10);

    const end = new Date(maxDate + 'T00:00:00');
    const start = new Date(end);
    start.setDate(start.getDate() - 29);
    const labels = buildDateRange(start.toISOString().slice(0,10), maxDate);

    const foodsByDate = new Map();
    labels.forEach(d => foodsByDate.set(d, new Set()));
    entries.forEach(({date, food}) => {
      if (!foodsByDate.has(date)) foodsByDate.set(date, new Set());
      foodsByDate.get(date).add(food);
    });

    const dailyFoodsArr = labels.map(d => Array.from(foodsByDate.get(d) || []));
    const dailyUniqueCounts = dailyFoodsArr.map(arr => new Set(arr).size);
    const rolling7Unique = computeRollingUnique(dailyFoodsArr, 7);

    const lastIndex = rolling7Unique.length - 1;
    const todayRolling = lastIndex >= 0 ? rolling7Unique[lastIndex] : 0;
    const avg30 = dailyUniqueCounts.reduce((a,b)=>a+b,0) / dailyUniqueCounts.length;
    const bestDay = Math.max(...dailyUniqueCounts);
    const daysAbove30 = dailyUniqueCounts.filter(v => v >= 30).length;

    document.getElementById('todaysCount').textContent = `${todayRolling} foods`;
    document.getElementById('avg30').textContent = `${avg30.toFixed(1)} foods`;
    document.getElementById('bestDay').textContent = `${bestDay} foods`;
    document.getElementById('daysAbove30').textContent = `${daysAbove30} days`;

    const canvas = document.getElementById('performanceChart');
    function resizeAndDraw() {
      drawChartCanvas(canvas, labels, dailyUniqueCounts, rolling7Unique);
    }
    // initial draw
    resizeAndDraw();
    // redraw on resize
    let resizeTimer = null;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeAndDraw, 150); });

    // debug logs
    console.log('CSV length:', text.length);
    console.log('Computed maxDate:', maxDate);
  })();

  </script>
</body>
</html>
