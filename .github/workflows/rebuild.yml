name: Rebuild daily list
on:
  schedule:
    - cron: "47 2 * * *"  # 02:47 UTC (03:47 BST)
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rebuild script
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
        run: |
          python rebuild.py

      - name: Commit updated CSVs and Chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the data files AND the generated webpage chart
          git add *.csv docs/index.html
          
          # Commit only if things actually changed so the workflow doesn't throw an error
          git commit -m "Update food logs and performance chart" || echo "No changes to commit"
          git push
