<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tracker - 30 Day Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; margin: 0; }
        .container { max-width: 100%; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin: 0 0 8px 0; font-size: 24px; color: #333; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        #chartContainer { position: relative; height: 400px; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-box { background: #f9f9f9; padding: 12px; border-radius: 6px; border-left: 4px solid #4CAF50; }
        .stat-label { font-size: 12px; color: #666; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 24px; font-weight: bold; color: #333; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥗 Food Tracker Performance</h1>
        <p class="subtitle">30-day view with rolling 7-day unique counts (2026-05-15 to 2026-06-13)</p>
        
        <div id="chartContainer">
            <canvas id="performanceChart"></canvas>
        </div>
        
        <div class="stats">
            <div class="stat-box" style="border-left-color: #2196F3;">
                <div class="stat-label">Today's 7-Day Unique Count</div>
                <div class="stat-value">26 foods</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">30-Day Average (daily)</div>
                <div class="stat-value">3.3 foods</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best Day (daily)</div>
                <div class="stat-value">15 foods</div>
            </div>
            <div class="stat-box" style="border-left-color: #FF9800;">
                <div class="stat-label">Days Above 30 (daily)</div>
                <div class="stat-value">0 days</div>
            </div>
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ["2026-05-15", "2026-05-16", "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-13"],
                datasets: [
                    {
                        label: 'Daily Unique Foods',
                        data: [0, 0, 5, 8, 5, 0, 0, 0, 0, 0, 4, 0, 8, 0, 0, 3, 2, 15, 0, 0, 0, 7, 8, 10, 14, 6, 2, 2, 0, 0],
                        borderColor: '#4CAF50',
                        backgroundColor: 'rgba(76, 175, 80, 0.08)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4
                    },
                    {
                        label: 'Rolling 7‑Day Unique Foods',
                        data: [12, 11, 13, 18, 21, 16, 16, 16, 16, 12, 7, 4, 11, 11, 11, 12, 13, 22, 22, 17, 17, 21, 26, 32, 32, 34, 34, 34, 29, 26],
                        borderColor: '#2196F3',
                        backgroundColor: 'rgba(33, 150, 243, 0.06)',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 3
                    },
                    {
                        label: 'Target (30 foods)',
                        data: Array(30).fill(30),
                        borderColor: '#FF9800',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}`,
                            afterBody: ctx => {
                                if (ctx[0].dataset.label === 'Rolling 7‑Day Unique Foods') {
                                    const val = ctx[0].parsed.y;
                                    return val >= 30 ? '✓ Goal met (7-day)!' : `${30 - val} to 30 (7-day)`;
                                }
                                return '';
                            }
                        }
                    }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 8 } },
                    y: { beginAtZero: true, ticks: { stepSize: 5 } }
                }
            }
        });
    </script>
</body>
</html>
